<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Login – BTech Restaurant</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark px-4">
      <a class="navbar-brand" href="{{ url_for('home') }}"
        >🍽️ BTech Restaurant</a
      >
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %}
    <div
      style="
        position: fixed;
        top: 70px;
        right: 20px;
        z-index: 9999;
        min-width: 280px;
      "
    >
      {% for cat, msg in messages %}
      <div class="alert-custom alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    </div>
    {% endif %} {% endwith %}

    <div class="page-wrapper">
      <div class="card-main" style="max-width: 440px">
        <div class="section-title">
          <h2>👤 User <span>Login</span></h2>
          <p>Enter your name to continue</p>
          <div class="divider"></div>
        </div>
        <form method="POST" action="{{ url_for('user_login') }}">
          <div class="mb-4">
            <label class="form-label">Your Name</label>
            <input
              type="text"
              name="name"
              class="form-control"
              placeholder="e.g. charan Reddy"
              autofocus
              required
            />
          </div>
          <div class="d-grid">
            <button
              type="submit"
              class="btn-primary-custom"
              style="width: 100%; text-align: center"
            >
              ➡️ Continue
            </button>
          </div>
        </form>
        <div class="back-link mt-3">
          <a href="{{ url_for('home') }}">← Back to Home</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      setTimeout(() => {
        document.querySelectorAll(".alert-custom").forEach((el) => {
          el.style.opacity = "0";
          setTimeout(() => el.remove(), 500);
        });
      }, 3000);
    </script>
  </body>
</html>
