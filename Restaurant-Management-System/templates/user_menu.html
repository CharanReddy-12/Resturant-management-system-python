<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu – BTech Restaurant</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <style>
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 22px;
        margin-top: 10px;
      }
      .menu-card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        transition:
          transform 0.22s,
          box-shadow 0.22s;
        border: 1.5px solid #f0f0f0;
      }
      .menu-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 32px rgba(230, 57, 70, 0.13);
      }
      .menu-card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        display: block;
      }
      .menu-card-body {
        padding: 14px 16px 16px;
      }
      .menu-item-id {
        font-size: 0.75rem;
        color: #aaa;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .menu-item-name {
        font-size: 1rem;
        font-weight: 700;
        color: #1d3557;
        margin-bottom: 8px;
      }
      .menu-item-price {
        display: inline-block;
        background: linear-gradient(135deg, #e63946, #f4a261);
        color: #fff;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 4px 14px;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark px-4">
      <a class="navbar-brand" href="{{ url_for('home') }}"
        >🍽️ BTech Restaurant</a
      >
      <span class="text-light" style="font-size: 0.9rem">👤 {{ name }}</span>
    </nav>

    <div class="page-wrapper">
      <div class="card-main full">
        <div class="section-title">
          <h2>📋 Our <span>Menu</span></h2>
          <p>Fresh, delicious food prepared with love</p>
          <div class="divider"></div>
        </div>

        <div class="menu-grid">
          {% for item in items %}
          <div class="menu-card">
            <img
              src="{{ item.image_url }}"
              alt="{{ item.name }}"
              onerror="
                this.src =
                  'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&q=80'
              "
            />
            <div class="menu-card-body">
              <div class="menu-item-id">#{{ item.id }}</div>
              <div class="menu-item-name">{{ item.name }}</div>
              <span class="menu-item-price"
                >₹{{ "%.2f"|format(item.price) }}</span
              >
            </div>
          </div>
          {% endfor %}
        </div>

        <div class="d-flex gap-3 mt-4 flex-wrap justify-content-center">
          <a href="{{ url_for('place_order') }}" class="btn-primary-custom"
            >🛒 Place Order</a
          >
          <a href="{{ url_for('user_dashboard') }}" class="btn-outline-custom"
            >← Back</a
          >
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
