<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTech Restaurant</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark px-4">
      <span class="navbar-brand">🍽️ BTech Restaurant</span>
    </nav>

    <div class="page-wrapper">
      <div class="card-main" style="max-width: 500px">
        <div class="welcome-header">
          <span class="restaurant-icon">🍽️</span>
          <h1 class="title1">
            Welcome to
            <span class="wave-text">
              <span>B</span><span>T</span><span>e</span><span>c</span
              ><span>h</span>
            </span>
            Restaurant
          </h1>
          <p>Taste the difference. Experience the best.</p>
          <div class="divider"></div>
        </div>
        <div class="home-buttons">
          <a href="{{ url_for('user_login') }}" class="btn-home btn-user"
            ><span class="icon">👤</span> User</a
          >
          <a href="{{ url_for('admin_login') }}" class="btn-home btn-admin"
            ><span class="icon">🔐</span> Admin</a
          >
          <a href="{{ url_for('quit_app') }}" class="btn-home btn-quit"
            ><span class="icon">🚪</span> Quit</a
          >
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
