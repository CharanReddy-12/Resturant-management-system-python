<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login – BTech Restaurant</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark px-4">
      <a class="navbar-brand" href="{{ url_for('home') }}"
        >🍽️ BTech Restaurant</a
      >
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %}
    <div
      style="
        position: fixed;
        top: 70px;
        right: 20px;
        z-index: 9999;
        min-width: 280px;
      "
    >
      {% for cat, msg in messages %}
      <div class="alert-custom alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    </div>
    {% endif %} {% endwith %}

    <div class="page-wrapper">
      <div class="card-main" style="max-width: 420px">
        <div class="section-title">
          <h2>🔐 Admin <span>Login</span></h2>
          <p>Enter your password to continue</p>
          <div class="divider"></div>
        </div>
        <form method="POST" action="{{ url_for('admin_login') }}">
          <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                name="password"
                id="pwdInput"
                class="form-control"
                placeholder="Enter admin password"
                autofocus
                required
              />
              <button type="button" class="toggle-pwd" onclick="togglePwd()">
                👁️
              </button>
            </div>
          </div>
          <div class="d-grid">
            <button
              type="submit"
              class="btn-dark-custom"
              style="width: 100%; text-align: center"
            >
              🔓 Login
            </button>
          </div>
        </form>
        <div class="back-link mt-3">
          <a href="{{ url_for('home') }}">← Back to Home</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function togglePwd() {
        var input = document.getElementById("pwdInput");
        input.type = input.type === "password" ? "text" : "password";
      }
      setTimeout(() => {
        document.querySelectorAll(".alert-custom").forEach((el) => {
          el.style.opacity = "0";
          setTimeout(() => el.remove(), 500);
        });
      }, 3000);
    </script>
  </body>
</html>
