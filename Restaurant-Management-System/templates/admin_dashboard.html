<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard – BTech Restaurant</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark px-4">
      <a class="navbar-brand" href="{{ url_for('home') }}"
        >🍽️ BTech Restaurant</a
      >
      <span class="text-warning" style="font-size: 0.9rem">🔐 Admin Panel</span>
    </nav>

    <div class="page-wrapper">
      <div class="card-main">
        <div class="section-title">
          <h2>🔐 Admin <span>Dashboard</span></h2>
          <p>Manage your restaurant operations</p>
          <div class="divider"></div>
        </div>
        <div class="dashboard-grid">
          <a href="{{ url_for('admin_menu') }}" class="dash-card">
            <span class="dash-icon">📋</span>
            <span class="dash-label">View Menu</span>
          </a>
          <a href="{{ url_for('add_item') }}" class="dash-card">
            <span class="dash-icon">➕</span>
            <span class="dash-label">Add Item</span>
          </a>
          <a href="{{ url_for('admin_menu') }}" class="dash-card">
            <span class="dash-icon">🗑️</span>
            <span class="dash-label">Delete Item</span>
          </a>
          <a href="{{ url_for('admin_bills') }}" class="dash-card">
            <span class="dash-icon">🧾</span>
            <span class="dash-label">View Bills</span>
          </a>
          <a href="{{ url_for('admin_reservations') }}" class="dash-card">
            <span class="dash-icon">🪑</span>
            <span class="dash-label">View Reservations</span>
          </a>
          <a
            href="{{ url_for('admin_logout') }}"
            class="dash-card"
            style="border-color: #ccc"
          >
            <span class="dash-icon">🚪</span>
            <span class="dash-label">Quit</span>
          </a>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
