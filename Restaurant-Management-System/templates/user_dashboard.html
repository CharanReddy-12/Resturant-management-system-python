<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – BTech Restaurant</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark px-4">
      <a class="navbar-brand" href="{{ url_for('home') }}"
        >🍽️ BTech Restaurant</a
      >
      <span class="text-light" style="font-size: 0.9rem">👤 {{ name }}</span>
    </nav>

    <div class="page-wrapper">
      <div class="card-main">
        <div class="section-title">
          <h2>🎉 Hello, <span>{{ name }}</span>!</h2>
          <p>What would you like to do today?</p>
          <div class="divider"></div>
        </div>
        <div class="dashboard-grid">
          <a href="{{ url_for('user_menu') }}" class="dash-card">
            <span class="dash-icon">📋</span>
            <span class="dash-label">View Menu</span>
          </a>
          <a href="{{ url_for('place_order') }}" class="dash-card">
            <span class="dash-icon">🛒</span>
            <span class="dash-label">Place Order</span>
          </a>
          <a href="{{ url_for('book_table') }}" class="dash-card">
            <span class="dash-icon">🪑</span>
            <span class="dash-label">Book Table</span>
          </a>
          <a
            href="{{ url_for('user_logout') }}"
            class="dash-card"
            style="border-color: #ccc"
          >
            <span class="dash-icon">🚪</span>
            <span class="dash-label">Quit</span>
          </a>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
