<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Item – BTech Restaurant</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark px-4">
      <a class="navbar-brand" href="{{ url_for('home') }}"
        >🍽️ BTech Restaurant</a
      >
      <span class="text-warning" style="font-size: 0.9rem">🔐 Admin Panel</span>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %}
    <div
      style="
        position: fixed;
        top: 70px;
        right: 20px;
        z-index: 9999;
        min-width: 280px;
      "
    >
      {% for cat, msg in messages %}
      <div class="alert-custom alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    </div>
    {% endif %} {% endwith %}

    <div class="page-wrapper">
      <div class="card-main" style="max-width: 480px">
        <div class="section-title">
          <h2>➕ Add <span>New Item</span></h2>
          <p>Add a new dish to the menu</p>
          <div class="divider"></div>
        </div>
        <form method="POST" action="{{ url_for('add_item') }}">
          <div class="mb-3">
            <label class="form-label">Item Name</label>
            <input
              type="text"
              name="name"
              class="form-control"
              placeholder="e.g. Paneer Tikka"
              required
              autofocus
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Price (₹)</label>
            <input
              type="number"
              name="price"
              class="form-control"
              placeholder="e.g. 150"
              min="1"
              step="0.01"
              required
            />
          </div>
          <div class="mb-4">
            <label class="form-label">Stock / Quantity</label>
            <input
              type="number"
              name="stock"
              class="form-control"
              placeholder="e.g. 50"
              min="1"
              required
            />
          </div>
          <div class="d-flex gap-3 justify-content-center flex-wrap">
            <button type="submit" class="btn-success-custom">
              ✅ Add Item
            </button>
            <a href="{{ url_for('admin_menu') }}" class="btn-outline-custom"
              >← Cancel</a
            >
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
